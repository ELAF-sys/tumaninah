<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طمأنينة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>

/* =====================================================
   TOKENS — خزامى دافئة على ورق فاتح، مع الطين كلون ثانوي
===================================================== */

:root{
    --paper:#F7F2E7;
    --paper-raised:#FFFDF8;
    --ink:#22322C;
    --ink-soft:#5D6B62;
    --ink-faint:#93A199;

    --teal:#5C3D96;
    --teal-deep:#360F6A;
    --teal-tint:#ECE6F6;

    --clay:#B9713F;
    --clay-tint:#F3E3D2;

    --line:#E1D8C4;
    --line-strong:#CBBE9F;

    --danger:#A8493D;
    --danger-tint:#F5E1DC;

    --radius-s:10px;
    --radius-m:16px;
    --radius-l:26px;

    --shadow:0 1px 2px rgba(34,50,44,.04), 0 10px 30px rgba(34,50,44,.06);
}

*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }

body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
}

button, input, textarea{ font-family:inherit; color:inherit; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

@media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* SHELL */

.shell{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
}

header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 22px 16px;
    position:sticky;
    top:0;
    background:linear-gradient(var(--paper) 78%, transparent);
    z-index:20;
}

.wordmark{ display:flex; align-items:center; gap:10px; font-size:20px; font-weight:800; color:var(--teal-deep); }

.logo-mark{ position:relative; width:28px; height:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.logo-mark img{ width:100%; height:100%; object-fit:contain; position:relative; z-index:1; }
.logo-mark::after{ content:""; position:absolute; inset:-5px; border-radius:50%; border:1.5px solid var(--teal); animation:breathe 2.6s ease-in-out infinite; }

@keyframes breathe{
    0%{ transform:scale(1); opacity:.55; }
    70%{ transform:scale(2.05); opacity:0; }
    100%{ transform:scale(2.05); opacity:0; }
}

.top-actions{ display:flex; align-items:center; gap:8px; }

.top-action{
    border:1px solid var(--line-strong);
    background:transparent;
    color:var(--ink-soft);
    font-size:13.5px;
    padding:9px 14px;
    border-radius:100px;
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
}
.top-action:hover{ border-color:var(--teal); color:var(--teal-deep); }

main.view{ flex:1; padding:4px 22px 60px; }

.foot-note{ text-align:center; font-size:12.5px; color:var(--ink-faint); margin-top:34px; line-height:1.8; }

/* PRIMITIVES */

.field{ margin-bottom:16px; }
.field label{ display:block; font-size:13.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }

.input, textarea{
    width:100%;
    border:1.5px solid var(--line-strong);
    background:var(--paper-raised);
    border-radius:var(--radius-s);
    padding:14px 15px;
    font-size:16px;
    outline:none;
    transition:border-color .15s;
}
.input{ height:52px; }
.input:focus, textarea:focus{ border-color:var(--teal); }
textarea{ min-height:78px; resize:vertical; line-height:1.6; }

.btn{
    width:100%; border:none; border-radius:var(--radius-s);
    padding:15px 20px; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .1s, background .15s;
}
.btn:active{ transform:scale(.985); }
.btn-primary{ background:var(--teal); color:#fff; }
.btn-primary:hover{ background:var(--teal-deep); }
.btn-ghost{ background:transparent; color:var(--teal-deep); border:1.5px solid var(--line-strong); }
.btn-ghost:hover{ border-color:var(--teal); }

.error-note{ background:var(--danger-tint); color:var(--danger); font-size:14px; padding:12px 14px; border-radius:var(--radius-s); margin-bottom:16px; display:none; }
.confirm-note{ color:var(--teal-deep); font-size:14px; font-weight:700; margin-top:12px; display:none; }

/* HOME */

.hero{ padding:26px 4px 10px; text-align:center; }
.hero-ring{ width:96px; height:96px; margin:0 auto 22px; border-radius:50%; background:var(--paper-raised); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; position:relative; }
.hero-ring img{ width:56px; height:56px; object-fit:contain; position:relative; z-index:1; }
.hero-ring .ring-anim{ position:absolute; inset:0; border-radius:50%; border:1.5px solid var(--teal); animation:breathe 2.6s ease-in-out infinite; }
.hero h1{ font-size:29px; font-weight:800; margin:0 0 10px; letter-spacing:-.2px; }
.hero p{ color:var(--ink-soft); font-size:16px; margin:0; line-height:1.7; }

.role-list{ margin-top:34px; border-top:1px solid var(--line); }
.role-row{ width:100%; background:transparent; border:none; border-bottom:1px solid var(--line); padding:22px 4px; display:flex; align-items:center; gap:16px; text-align:right; }
.role-row:hover .role-chevron{ transform:translateX(-4px); }
.role-icon{ width:46px; height:46px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:20px; }
.role-icon.companion{ background:var(--teal-tint); color:var(--teal-deep); }
.role-icon.staff{ background:var(--clay-tint); color:var(--clay); }
.role-copy{ flex:1; }
.role-copy .t{ font-size:17.5px; font-weight:700; margin-bottom:3px; }
.role-copy .d{ font-size:14px; color:var(--ink-soft); line-height:1.6; }
.role-chevron{ color:var(--ink-faint); font-size:19px; transition:transform .15s; }

/* MRN ENTRY */

.code-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-l); padding:34px 26px 30px; box-shadow:var(--shadow); margin-top:18px; text-align:center; }
.code-card h2{ font-size:21px; margin:0 0 8px; }
.code-card p{ color:var(--ink-soft); font-size:14.5px; margin:0 0 22px; line-height:1.7; }
.mrn-input{ text-align:center; letter-spacing:3px; font-size:20px; font-weight:700; direction:ltr; }
.hint-row{ font-size:12.5px; color:var(--ink-faint); margin-top:16px; line-height:1.8; }

.privacy-banner{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--teal-tint); color:var(--teal-deep);
    border-radius:var(--radius-m); padding:14px 16px;
    font-size:13.5px; line-height:1.8; margin-bottom:22px;
}
.privacy-banner .ic{ font-size:17px; flex-shrink:0; }

/* COMPANION DASHBOARD */

.patient-strip{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-l); padding:24px; box-shadow:var(--shadow); margin-bottom:18px; }
.patient-strip .p-name{ font-size:18px; font-weight:800; margin-bottom:2px; }
.patient-strip .p-loc{ font-size:14px; color:var(--ink-soft); margin-bottom:18px; }

.status-pill{ display:inline-flex; align-items:center; gap:10px; background:var(--teal-tint); color:var(--teal-deep); font-weight:700; font-size:18.5px; padding:13px 18px; border-radius:100px; }
.status-dot{ width:11px; height:11px; border-radius:50%; background:var(--teal); position:relative; flex-shrink:0; }
.status-dot::after{ content:""; position:absolute; inset:0; border-radius:50%; background:var(--teal); animation:breathe 2.6s ease-in-out infinite; }
.updated-line{ margin-top:12px; font-size:13px; color:var(--ink-faint); }

section.block{ margin-bottom:32px; }
section.block h2{ font-size:15.5px; font-weight:700; color:var(--ink-soft); margin:0 0 16px; }

.timeline{ list-style:none; margin:0; padding:0; }
.timeline li{ display:flex; gap:15px; position:relative; padding-bottom:24px; }
.timeline li:last-child{ padding-bottom:0; }
.timeline li::before{ content:""; position:absolute; right:5.5px; top:22px; bottom:0; width:1.5px; background:var(--line-strong); }
.timeline li:last-child::before{ display:none; }
.t-dot{ width:13px; height:13px; border-radius:50%; background:var(--line-strong); flex-shrink:0; margin-top:3px; border:3px solid var(--paper); }
.timeline li.active .t-dot{ background:var(--teal); }
.t-label{ font-weight:700; font-size:15.5px; }
.timeline li:not(.active) .t-label{ color:var(--ink-soft); font-weight:500; }
.t-time{ font-size:13px; color:var(--ink-faint); margin-top:2px; }

.info-scroll{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin:0 -22px; padding-inline:22px; }
.info-pill{ flex-shrink:0; background:var(--paper-raised); border:1.5px solid var(--line-strong); border-radius:100px; padding:12px 18px; font-size:14px; font-weight:700; white-space:nowrap; }
.info-pill.open{ background:var(--clay); border-color:var(--clay); color:#fff; }
.info-answer{ background:var(--clay-tint); border-radius:var(--radius-m); padding:16px 18px; font-size:14.5px; line-height:1.8; margin-top:12px; display:none; }

/* CHAT / AI TRANSLATION */

.avail-row{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; margin-bottom:14px; }
.avail-toggle{ border:1.5px solid var(--line-strong); background:var(--paper-raised); border-radius:100px; padding:9px 15px; font-size:13px; font-weight:700; }
.avail-toggle.off{ background:var(--clay-tint); border-color:var(--clay); color:var(--clay); }
.avail-hint{ font-size:11.5px; color:var(--ink-faint); }

.chat-thread{ display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }

.bubble{ max-width:84%; border-radius:16px; padding:12px 14px; }
.bubble.mine{ align-self:flex-end; background:var(--teal); color:#fff; border-bottom-left-radius:4px; }
.bubble.theirs{ align-self:flex-start; background:var(--paper-raised); border:1px solid var(--line); border-bottom-right-radius:4px; }

.bubble-tag{ font-size:11px; font-weight:700; opacity:.85; margin-bottom:4px; }
.bubble.mine .bubble-tag{ color:#fff; }
.bubble.theirs .bubble-tag{ color:var(--teal-deep); }

.bubble-main{ font-size:15px; line-height:1.6; }
.bubble-sub{ font-size:12.5px; opacity:.8; margin-top:7px; padding-top:7px; border-top:1px solid rgba(255,255,255,.25); line-height:1.6; }
.bubble.theirs .bubble-sub{ border-top-color:var(--line); color:var(--ink-soft); }

.chip-row{ display:flex; flex-wrap:wrap; gap:9px; margin-bottom:12px; }
.chip{ background:var(--paper-raised); border:1.5px solid var(--line-strong); border-radius:100px; padding:10px 16px; font-size:13.5px; font-weight:500; }
.chip:hover{ border-color:var(--teal); background:var(--teal-tint); }

.chat-note{ font-size:12px; color:var(--ink-faint); line-height:1.7; margin-bottom:12px; }
.chat-input-row{ display:flex; gap:8px; }
.chat-input-row input{ flex:1; height:48px; border:1.5px solid var(--line-strong); border-radius:var(--radius-s); padding:0 14px; outline:none; background:var(--paper-raised); }
.chat-input-row input:focus{ border-color:var(--teal); }
.chat-input-row button{ border:none; background:var(--teal); color:#fff; border-radius:var(--radius-s); padding:0 20px; font-weight:700; }

.empty-note{ text-align:center; color:var(--ink-faint); font-size:13.5px; padding:16px 10px; }

/* DOCUMENTS & SERVICES */

.doc-row{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 18px; margin-bottom:10px; }
.doc-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.doc-name{ font-size:15px; font-weight:700; margin-bottom:3px; }
.doc-desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
.doc-fee{ font-size:12.5px; font-weight:700; color:var(--ink-soft); white-space:nowrap; }
.doc-fee.free{ color:var(--teal-deep); }
.doc-action-btn{ border:1.5px solid var(--teal); background:transparent; color:var(--teal-deep); border-radius:100px; padding:9px 16px; font-size:13px; font-weight:700; white-space:nowrap; }
.doc-action-btn:hover{ background:var(--teal-tint); }
.doc-status-tag{ font-size:12.5px; font-weight:700; padding:7px 13px; border-radius:100px; white-space:nowrap; }
.doc-status-tag.processing{ background:var(--clay-tint); color:var(--clay); }
.doc-status-tag.ready{ background:var(--teal-tint); color:var(--teal-deep); }

.pay-inline{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--line-strong); }
.pay-inline .field{ margin-bottom:12px; }
.pay-row{ display:flex; gap:10px; }
.pay-row .field{ flex:1; }

/* LANGUAGE SHEET */

.lang-sheet{ position:fixed; inset:0; background:rgba(34,50,44,.4); display:flex; align-items:flex-end; justify-content:center; z-index:100; }
.lang-sheet.hidden{ display:none; }
.lang-sheet-inner{ width:100%; max-width:520px; background:var(--paper-raised); border-radius:24px 24px 0 0; padding:26px 22px 30px; box-shadow:0 -10px 40px rgba(0,0,0,.15); }
.lang-sheet-title{ font-size:16px; font-weight:800; margin-bottom:16px; }
.lang-option{ width:100%; text-align:right; background:transparent; border:1.5px solid var(--line-strong); border-radius:var(--radius-s); padding:14px 16px; font-size:15.5px; font-weight:600; margin-bottom:10px; }
.lang-option.selected{ background:var(--teal); border-color:var(--teal); color:#fff; }

/* STAFF LOGIN */

.security-note{ margin-top:20px; font-size:12.5px; color:var(--ink-faint); line-height:1.8; text-align:center; }
.demo-hint{ background:var(--teal-tint); color:var(--teal-deep); font-size:13px; padding:11px 14px; border-radius:var(--radius-s); margin-bottom:18px; line-height:1.7; }

/* STAFF DASHBOARD */

.shift-banner{ display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
.shift-banner .greet{ font-size:20px; font-weight:800; margin-bottom:3px; }
.shift-banner .sub{ font-size:13.5px; color:var(--ink-soft); }
.logout-link{ border:none; background:none; color:var(--danger); font-size:13.5px; font-weight:700; padding:6px; }

.patient-row{ width:100%; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px 20px; display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; text-align:right; box-shadow:var(--shadow); }
.patient-row .info .name{ font-size:16.5px; font-weight:700; margin-bottom:3px; }
.patient-row .info .loc{ font-size:13px; color:var(--ink-soft); }
.patient-row .right{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
.tag{ background:var(--teal-tint); color:var(--teal-deep); font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:100px; white-space:nowrap; }
.badge-count{ background:var(--clay); color:#fff; font-size:11.5px; font-weight:700; min-width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0 5px; }

.quick-status{ display:flex; flex-wrap:wrap; gap:8px; }
.status-opt{ background:var(--paper-raised); border:1.5px solid var(--line-strong); border-radius:100px; padding:10px 16px; font-size:13.5px; font-weight:600; }
.status-opt.selected{ background:var(--teal); border-color:var(--teal); color:#fff; }

.staff-doc-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:10px; }
.staff-doc-row .n{ font-size:14.5px; font-weight:700; margin-bottom:2px; }
.staff-doc-row .m{ font-size:12px; color:var(--ink-faint); }
.mark-ready-btn{ border:none; background:var(--teal); color:#fff; border-radius:100px; padding:9px 15px; font-size:12.5px; font-weight:700; white-space:nowrap; }

@media (max-width:400px){
    header.top{ padding:18px 16px 14px; }
    main.view{ padding:4px 16px 50px; }
    .top-action{ padding:8px 11px; font-size:12.5px; }
}

</style>

/* ---------- المحادثة ثنائية اللغة ---------- */

function renderChatThread(patientId, viewerRole){
    const msgs = chatMessages.filter(m => m.patientId === patientId);

    if(msgs.length === 0){
        return `<div class="empty-note">لا توجد رسائل بعد — ابدأ المحادثة من الأسفل</div>`;
    }

    return `<div class="chat-thread">
        ${msgs.map(m => {
            const mine = (viewerRole === "companion" && m.sender === "companion") ||
                         (viewerRole === "staff" && m.sender !== "companion");
            const view = viewerRole === "companion" ? m.forCompanion : m.forStaff;
            const tag = m.sender === "bot" ? "🤖 رد آلي فوري" : (m.sender === "staff" ? "الطاقم الصحي" : "");

            return `
            <div class="bubble ${mine ? "mine" : "theirs"}">
                ${ tag ? `<div class="bubble-tag">${tag}</div>` : "" }
                <div class="bubble-main" dir="${view.main.dir}">${view.main.text}</div>
                ${ view.sub ? `<div class="bubble-sub" dir="${view.sub.dir}">${view.sub.text}</div>` : "" }
            </div>`;
        }).join("")}
    </div>`;
}

function pushMessage(msg){
    msg.id = msgSeq++;
    msg.seenByStaff = msg.sender !== "companion";
    chatMessages.push(msg);
}

function sendQuickPhrase(patientId, phraseId){
    const phrase = quickPhrases.find(q => q.id === phraseId);
    const lang = state.companionLang;
    const dir = langDir(lang);

    pushMessage({
        patientId, sender:"companion",
        forCompanion:{ main:{ text:phrase[lang], dir }, sub: lang !== "ar" ? { text:phrase.ar, dir:"rtl" } : null },
        forStaff:{ main:{ text:phrase.ar, dir:"rtl" }, sub: lang !== "ar" ? { text:phrase[lang], dir } : null }
    });

    if(!state.staffAvailable){
        triggerAutoReply(patientId, phrase.trigger);
    } else {
        render();
    }
}

function sendFreeMessage(patientId){
    const box = document.getElementById("chatBox");
    const text = box.value.trim();
    if(!text) return;

    const lang = state.companionLang;
    const dir = langDir(lang);

    pushMessage({
        patientId, sender:"companion",
        forCompanion:{ main:{ text, dir }, sub:null },
        forStaff:{ main:{ text, dir }, sub: lang !== "ar" ? { text:"🌐 ستُترجم هذه الرسالة تلقائيًا بواسطة الذكاء الاصطناعي", dir:"rtl" } : null }
    });

    box.value = "";

    if(!state.staffAvailable){
        triggerAutoReply(patientId, matchTrigger(text));
    } else {
        render();
    }
}

function triggerAutoReply(patientId, trigger){
    render(); // show the companion's message immediately

    setTimeout(() => {
        const patient = findPatient(patientId);
        const lang = state.companionLang;
        const dir = langDir(lang);
        const arText = autoTemplates[trigger].ar(patient);
        const translated = lang !== "ar" ? autoTemplates[trigger][lang](patient) : null;

        pushMessage({
            patientId, sender:"bot",
            forCompanion:{ main:{ text: translated || arText, dir: translated ? dir : "rtl" }, sub: translated ? { text:arText, dir:"rtl" } : null },
            forStaff:{ main:{ text:arText, dir:"rtl" }, sub: translated ? { text:translated, dir } : null }
        });

        if(state.screen === "companionDash" || state.screen === "staffDetail"){
            render();
        }
    }, 700);
}

function toggleInfo(i){

    const answerBox = document.getElementById("infoAnswer");

    pills.forEach(p => p.classList.remove("open"));

    if(wasOpen){ answerBox.style.display = "none"; return; }

    pills[i].classList.add("open");
    answerBox.textContent = infoTopics[i].text;
    answerBox.style.display = "block";
}

/* ---------- الوثائق والخدمات ---------- */

function renderDocumentList(patientId){
    return documents.map(doc => {
        const req = docRequests.find(r => r.patientId === patientId && r.docId === doc.id);

        let rightSide;
        if(!req){
            rightSide = `<button class="doc-action-btn" onclick="requestDocument(${patientId}, '${doc.id}')">طلب</button>`;
        } else if(req.status === "processing"){
            rightSide = `<span class="doc-status-tag processing">قيد التجهيز</span>`;
        } else {
            rightSide = `<span class="doc-status-tag ready">✅ جاهزة للاستلام</span>`;
        }

        return `
        <div class="doc-row">
            <div class="doc-top">
                <div>
                    <div class="doc-name">${doc.name}</div>
                    <div class="doc-fee ${doc.fee === 0 ? "free" : ""}">${doc.fee === 0 ? "مجانية" : doc.fee + " ر.س"}</div>
                </div>
                ${rightSide}
            </div>
            <div class="doc-desc" style="margin-top:8px">${doc.desc}</div>
            <div id="payBox-${patientId}-${doc.id}"></div>
        </div>`;
    }).join("");
}

function requestDocument(patientId, docId){
    const doc = documents.find(d => d.id === docId);

    if(doc.fee === 0){
        docRequests.push({ id:docSeq++, patientId, docId, name:doc.name, fee:0, paid:true, status:"processing" });
        render();
        return;
    }

    const box = document.getElementById(`payBox-${patientId}-${docId}`);
    box.innerHTML = `
        <div class="pay-inline">
            <div class="pay-row">
                <div class="field">
                    <label>رقم البطاقة</label>
                    <input class="input" placeholder="•••• •••• •••• ••••" maxlength="19">
                </div>
            </div>
            <button class="btn btn-primary" onclick="submitPayment(${patientId}, '${docId}')">ادفع ${doc.fee} ر.س وأرسل الطلب</button>
        </div>`;
}

function submitPayment(patientId, docId){
    const doc = documents.find(d => d.id === docId);
    docRequests.push({ id:docSeq++, patientId, docId, name:doc.name, fee:doc.fee, paid:true, status:"processing" });
    render();
}

===================================================== */

function renderStaffDashboard(){
    shell(`
        <div class="shift-banner">
            <div>
                <div class="greet">مرحبًا ${state.currentStaff.name}</div>
                <div class="sub">الطاقم الصحي · ${patients.length} مريض تحت متابعتك اليوم</div>
            </div>
            <button class="logout-link" onclick="staffLogout()">تسجيل الخروج</button>
        </div>

        <section class="block">
            <h2>مرضاك</h2>
            ${patients.map(p => `
                <button class="patient-row" onclick="openStaffDetail(${p.id})">
                    <span class="info">
                        <span class="name">${p.name}</span>
                        <span class="loc">${p.ward} · ${p.room}</span>
                    </span>
                    <span class="right">
                        ${ unreadForStaff(p.id) > 0 ? `<span class="badge-count">${unreadForStaff(p.id)}</span>` : "" }
                        <span class="tag">${statusOptions[p.statusKey].label}</span>
                    </span>
                </button>
            `).join("")}
        </section>

        <p class="foot-note">نموذج أولي — بيانات المرضى والمحادثات تجريبية.</p>
    `, true);
}

function staffLogout(){
    state.currentStaff = null;
    goHome();
}

/* =====================================================
   لوحة الطاقم الصحي — تفاصيل مريض
===================================================== */

function openStaffDetail(id){
    markSeenByStaff(id);
    state.screen = "staffDetail";
    state.activePatientId = id;
    render();
}

function backToStaffDash(){
    state.screen = "staffDash";
    state.activePatientId = null;
    render();
}

function renderStaffDetail(){
    const patient = findPatient(state.activePatientId);
    const pendingDocs = docRequests.filter(r => r.patientId === patient.id && r.status === "processing");

    shell(`
        <button class="top-action" style="margin-bottom:18px" onclick="backToStaffDash()">← رجوع لقائمة المرضى</button>

        <div class="patient-strip">
            <div class="p-name">${patient.name}</div>
            <div class="p-loc">${patient.ward} · ${patient.floor} · ${patient.room}</div>
            <div class="updated-line">آخر تحديث: ${patient.updated}</div>
        </div>

        <section class="block">
            <h2>تحديث حالة المريض</h2>
            <div class="quick-status">
                ${Object.entries(statusOptions).map(([key, val]) => `
                    <button class="status-opt ${patient.statusKey === key ? "selected" : ""}" onclick="updateStatus(${patient.id}, '${key}')">${val.label}</button>
                `).join("")}
            </div>
        </section>

        <section class="block">
            <h2>المحادثة مع مرافق المريض</h2>

            ${ renderChatThread(patient.id, "staff") }

            <div class="chip-row">
                ${staffQuickReplies.map(r => `
                    <button class="chip" onclick="sendStaffQuickReply(${patient.id}, '${r.id}')">${r.ar}</button>
                `).join("")}
            </div>

            <div class="chat-note">🌐 ردودك تُترجم فوريًا للمرافق بلغته المختارة.</div>

            <div class="chat-input-row">
                <input id="staffChatBox" placeholder="اكتب ردك هنا...">
                <button onclick="sendStaffMessage(${patient.id})">إرسال</button>
            </div>
        </section>

        <section class="block" style="margin-bottom:6px">
            <h2>طلبات الوثائق</h2>
            ${
                pendingDocs.length === 0
                ? `<div class="empty-note">لا توجد طلبات وثائق قيد التجهيز حاليًا</div>`
                : pendingDocs.map(r => `
                    <div class="staff-doc-row">
                        <div>
                            <div class="n">${r.name}</div>
                            <div class="m">${r.fee === 0 ? "مجانية" : r.fee + " ر.س — تم الدفع"}</div>
                        </div>
                        <button class="mark-ready-btn" onclick="markDocReady(${r.id})">تحديد كجاهزة</button>
                    </div>
                `).join("")
            }
        </section>

        <p class="foot-note">نموذج أولي للعرض — التحديثات هنا توضيحية.</p>
    `, true);
}

function sendStaffQuickReply(patientId, replyId){
    const reply = staffQuickReplies.find(r => r.id === replyId);
    const lang = state.companionLang;
    const dir = langDir(lang);

    pushMessage({
        patientId, sender:"staff",
        forStaff:{ main:{ text:reply.ar, dir:"rtl" }, sub: lang !== "ar" ? { text:reply[lang], dir } : null },
        forCompanion:{ main:{ text: lang !== "ar" ? reply[lang] : reply.ar, dir: lang !== "ar" ? dir : "rtl" }, sub: lang !== "ar" ? { text:reply.ar, dir:"rtl" } : null }
    });

    render();
}

function sendStaffMessage(patientId){
    const box = document.getElementById("staffChatBox");
    const text = box.value.trim();
    if(!text) return;

    const lang = state.companionLang;
    const dir = langDir(lang);

    pushMessage({
        patientId, sender:"staff",
        forStaff:{ main:{ text, dir:"rtl" }, sub:null },
        forCompanion:{ main:{ text, dir:"rtl" }, sub: lang !== "ar" ? { text:"🌐 ستظهر ترجمة هذه الرسالة هنا تلقائيًا", dir } : null }
    });

    box.value = "";
    render();
}

function updateStatus(patientId, key){
    const patient = findPatient(patientId);
    patient.statusKey = key;
    patient.updated = "الآن";
    patient.timeline[0] = { label:"الآن: " + statusOptions[key].label, time:"الآن", active:true };
    render();
}

function markDocReady(reqId){
    const req = docRequests.find(r => r.id === reqId);
    req.status = "ready";
    render();
}

/* =====================================================
   الموجّه
===================================================== */

function render(){
    if(state.screen === "home") return renderHome();
    if(state.screen === "companionCode") return renderCompanionCode();
    if(state.screen === "companionDash") return renderCompanionDashboard();
    if(state.screen === "staffLogin") return renderStaffLogin();
    if(state.screen === "staffDash") return renderStaffDashboard();
    if(state.screen === "staffDetail") return renderStaffDetail();
}

render();

</script>

</body>
</html>
